#:schema ./agenticrc.schema.json
root = true
namespace = "agenticgo"

[build]
bases = ["go", "docker"]
apt_packages = ["make", "shellcheck"]

[[build.custom_installs]]
name = "golangci-lint"
run = [
  "curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b /usr/local/bin v2.15.0",
]

[run]
mounts = [
  "go-mod:$CONTAINER_HOME/go",
  "go-cache:$CONTAINER_HOME/.cache/go-build",
  "golangci-lint-cache:$CONTAINER_HOME/.cache/golangci-lint",
]

[run.dind]
enabled = true

[run.proxy]
enabled = true
mode = "enforce"
allowed_hosts = [
  "proxy.golang.org",       # go modules, and toolchains via GOTOOLCHAIN
  "sum.golang.org",         # go module checksums
  "deb.debian.org",         # apt in images the integration tests build in the Docker sidecar
  ".claude.ai",             # the integration test image installs Claude, whichever tool runs
  "go.dev",                 # language spec, release notes and blog for WebFetch
  "docs.microsandbox.dev",  # msb CLI and network policy docs for WebFetch
  "docs.docker.com",        # Docker Engine, CLI and Sandboxes docs for WebFetch
  "docs.rancherdesktop.io", # Rancher Desktop docs for WebFetch
]
