#:schema ./agenticrc.schema.json
root = true
namespace = "agenticgo"

[build]
bases = ["go"]
apt_packages = ["make", "shellcheck"]

[[build.custom_installs]]
name = "golangci-lint"
run = [
  "curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b /usr/local/bin v2.13.1",
]

[run]
extra_mounts = [
  "go-mod:$CONTAINER_HOME/go",
  "go-cache:$CONTAINER_HOME/.cache/go-build",
  "golangci-lint-cache:$CONTAINER_HOME/.cache/golangci-lint",
]
