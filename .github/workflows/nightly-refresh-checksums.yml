name: Nightly checksum refresh

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refresh installer script checksums
        run: make fix-checksums-all

      # Always uploaded, so an unchanged file lets the PR job close a stale PR
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: internal/image/tools/checksums.json
          retention-days: 1

  # Holds the write token apart from refresh, which fetches third-party installers.
  pr:
    needs: [refresh]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: internal/image/tools

      - name: Open PR if checksums changed
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "fix(deps): refresh installer script checksums"
          title: "fix(deps): refresh installer script checksums"
          body: >
            One or more installer script checksums in `internal/image/tools/checksums.json`
            no longer match the live content at their pinned URL (Claude, Copilot, or
            OpenCode's installer changed upstream). Review the diff at the source URL
            before merging - see `docs/security-model.md` for why these are checksum-pinned.
          branch: chore/refresh-install-checksums
          delete-branch: true
          add-paths: internal/image/tools/checksums.json
