name: Audit

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: ./.github/workflows/dependency-audit.yml

  # Holds the issue token apart from audit, which runs third-party code.
  report:
    needs: [audit]
    if: needs.audit.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audit-findings

      - name: Report findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/report-audit.sh audit.log vulns.json

  # A passing audit on main closes the issue a failed one opened.
  resolve:
    needs: [audit]
    if: needs.audit.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close audit issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for issue in $(gh issue list --label security-audit --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --reason completed --comment "Nightly audit passed: $RUN_URL"
          done
