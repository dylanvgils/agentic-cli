name: Release

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release (e.g. v1.2.3). Empty auto-computes the next version, or skips if there's nothing new."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      create: ${{ steps.resolve.outputs.create }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve release tag
        id: resolve
        env:
          TAG_INPUT: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: .github/scripts/resolve-release-tag.sh "$TAG_INPUT" "$EVENT_NAME" >> "$GITHUB_OUTPUT"

  # A re-release validates the existing tag; a new tag validates github.sha, the commit it tags.
  validate:
    needs: [resolve]
    if: needs.resolve.outputs.skip != 'true'
    uses: ./.github/workflows/reusable-validate.yml
    with:
      sonar: false
      ref: ${{ needs.resolve.outputs.create == 'false' && needs.resolve.outputs.release_tag || '' }}

  tag:
    needs: [resolve, validate]
    if: needs.resolve.outputs.create == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create and push tag
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"

  release:
    needs: [resolve, validate, tag]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/setup-go

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.resolve.outputs.release_tag }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
