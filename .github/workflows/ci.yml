name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  fix-checksum:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'renovate[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update checksums
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git switch -C "$HEAD_REF" "origin/$HEAD_REF"
          make fix-checksums
          if git diff --quiet -- internal/tools/versions.json; then
            echo "checksums already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add internal/tools/versions.json
            git commit -m "fix(deps): update nvm_checksum for bumped nvm version"
            git push origin "HEAD:$HEAD_REF"
          fi

  validate-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Validate PR title
        run: .github/scripts/validate-title.sh "${{ github.event.pull_request.title }}"

  ci:
    needs: [fix-checksum]
    if: ${{ !cancelled() && (needs.fix-checksum.result == 'success' || needs.fix-checksum.result == 'skipped') }}
    uses: ./.github/workflows/validate.yml
