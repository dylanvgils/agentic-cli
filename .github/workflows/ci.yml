name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  renovate-checksums:
    if: github.event_name == 'pull_request' && github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update checksums
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git switch -C "$HEAD_REF" "origin/$HEAD_REF"
          make fix-checksums
          if git diff --quiet -- internal/image/tools/checksums.json; then
            echo "checksums already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add internal/image/tools/checksums.json
            git commit -m "fix(deps): update nvm checksum for bumped nvm version"
            git push origin "HEAD:$HEAD_REF"
          fi

  validate:
    needs: [renovate-checksums]
    if: ${{ !cancelled() && (needs.renovate-checksums.result == 'success' || needs.renovate-checksums.result == 'skipped') }}
    uses: ./.github/workflows/reusable-validate.yml
    secrets: inherit
