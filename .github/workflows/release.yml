name: Release

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release (e.g. v1.2.3). Empty auto-computes the next version, or skips if there's nothing new."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      sonar: false

  tag:
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "release must run from main, got $GITHUB_REF"
            exit 1
          fi

      - name: Resolve release tag
        id: resolve
        env:
          TAG_INPUT: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: .github/scripts/resolve-release-tag.sh "$TAG_INPUT" "$EVENT_NAME" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.create == 'true'
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

  release:
    needs: [tag]
    if: ${{ !cancelled() && needs.tag.result == 'success' && needs.tag.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.release_tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.tag.outputs.release_tag }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.tag.outputs.previous_tag }}
