name: Release

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release (e.g. v1.2.3). Empty auto-computes the next version, or skips if there's nothing new."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  tag:
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "release must run from main, got ${{ github.ref }}"
            exit 1
          fi

      - name: Resolve release tag
        id: resolve
        run: .github/scripts/resolve-release-tag.sh "${{ inputs.tag }}" "${{ github.event_name }}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.create == 'true'
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

  release:
    needs: [tag]
    if: ${{ !cancelled() && needs.tag.result == 'success' && needs.tag.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.release_tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.tag.outputs.release_tag }}
