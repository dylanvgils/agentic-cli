name: Set up msb
description: Enables KVM and installs the pinned microsandbox CLI on the PATH

runs:
  using: composite
  steps:
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # Outside the checkout, whose install.sh and install.ps1 share names with msb's release assets
    - name: Install msb
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        # sha256 of the release's checksums.sha256, which pins the tarball's checksum in turn;
        # Renovate bumps both
        MSB_VERSION: v0.7.11
        MSB_CHECKSUMS_SHA256: 9b3efd06d36d5ce47ccf3978a11319ae74a8cbd4a1af074dbd0776ca861658f5
      run: |
        base="https://github.com/superradcompany/microsandbox/releases/download/$MSB_VERSION"
        curl --proto =https --tlsv1.2 --fail --silent --show-error --location --remote-name "$base/checksums.sha256"
        echo "$MSB_CHECKSUMS_SHA256  checksums.sha256" | sha256sum --check
        curl --proto =https --tlsv1.2 --fail --silent --show-error --location --remote-name "$base/microsandbox-linux-x86_64.tar.gz"
        grep ' microsandbox-linux-x86_64.tar.gz$' checksums.sha256 | sha256sum --check

        mkdir -p "$HOME/.microsandbox"
        tar -xzf microsandbox-linux-x86_64.tar.gz -C "$HOME/.microsandbox"
        # msb loads its libkrunfw from its own dir, so keep the archive's layout
        dirname "$(find "$HOME/.microsandbox" -type f -name msb | head -n 1)" >> "$GITHUB_PATH"

    - name: Check msb
      shell: bash
      run: msb --version
