sonar.projectKey=agentic-cli
sonar.organization=dylanvgils-github

sonar.sources=.
sonar.exclusions=**/*_test.go,bin/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out

# Report only - don't fail CI on the quality gate
sonar.qualitygate.wait=false

sonar.issue.ignore.multicriteria=e1,e2,e3
# Write-Host is the right cmdlet for installer output, not pipeline data
sonar.issue.ignore.multicriteria.e1.ruleKey=powershelldre:S8677
sonar.issue.ignore.multicriteria.e1.resourceKey=install.ps1
# Sonar sums complexity across t.Run closures, flagging flat subtest lists
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*_test.go
# Instruction is the Dockerfile term; Renderer would hide it
sonar.issue.ignore.multicriteria.e3.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.e3.resourceKey=internal/dockerfile/file.go
