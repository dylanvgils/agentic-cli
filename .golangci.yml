version: "2"

run:
  build-tags:
    - integration

linters:
  enable:
    - depguard
  settings:
    depguard:
      rules:
        base:
          files:
            - "**/internal/base/**"
          deny:
            - pkg: github.com/dylanvgils/agentic-cli/internal/config
              desc: internal/base is the lowest layer
            - pkg: github.com/dylanvgils/agentic-cli/internal/runtime
              desc: internal/base is the lowest layer
            - pkg: github.com/dylanvgils/agentic-cli/internal/image
              desc: internal/base is the lowest layer
            - pkg: github.com/dylanvgils/agentic-cli/internal/network
              desc: internal/base is the lowest layer
            - pkg: github.com/dylanvgils/agentic-cli/internal/usecase
              desc: internal/base is the lowest layer
            - pkg: github.com/dylanvgils/agentic-cli/internal/cli
              desc: internal/base is the lowest layer
        sandbox:
          files:
            - "**/internal/runtime/sandbox/**"
          deny:
            - pkg: github.com/dylanvgils/agentic-cli/internal/config
              desc: runtime/sandbox imports only internal/base
            - pkg: github.com/dylanvgils/agentic-cli/internal/image
              desc: runtime/sandbox imports only internal/base
            - pkg: github.com/dylanvgils/agentic-cli/internal/network
              desc: runtime/sandbox imports only internal/base
            - pkg: github.com/dylanvgils/agentic-cli/internal/runtime/docker
              desc: runtime/sandbox imports only internal/base
            - pkg: github.com/dylanvgils/agentic-cli/internal/runtime/dind
              desc: runtime/sandbox imports only internal/base
            - pkg: github.com/dylanvgils/agentic-cli/internal/runtime/microsandbox
              desc: runtime/sandbox imports only internal/base
            - pkg: github.com/dylanvgils/agentic-cli/internal/usecase
              desc: runtime/sandbox imports only internal/base
            - pkg: github.com/dylanvgils/agentic-cli/internal/cli
              desc: runtime/sandbox imports only internal/base
        config:
          files:
            - "**/internal/config/**"
          deny:
            - pkg: github.com/dylanvgils/agentic-cli/internal/image
              desc: config imports only internal/base and runtime/sandbox
            - pkg: github.com/dylanvgils/agentic-cli/internal/network
              desc: config imports only internal/base and runtime/sandbox
            - pkg: github.com/dylanvgils/agentic-cli/internal/runtime/docker
              desc: config imports only internal/base and runtime/sandbox
            - pkg: github.com/dylanvgils/agentic-cli/internal/runtime/dind
              desc: config imports only internal/base and runtime/sandbox
            - pkg: github.com/dylanvgils/agentic-cli/internal/runtime/microsandbox
              desc: config imports only internal/base and runtime/sandbox
            - pkg: github.com/dylanvgils/agentic-cli/internal/usecase
              desc: config imports only internal/base and runtime/sandbox
            - pkg: github.com/dylanvgils/agentic-cli/internal/cli
              desc: config imports only internal/base and runtime/sandbox
        image:
          files:
            - "**/internal/image/**"
          deny:
            - pkg: github.com/dylanvgils/agentic-cli/internal/network
              desc: image never imports network or a higher layer
            - pkg: github.com/dylanvgils/agentic-cli/internal/runtime/docker
              desc: image never imports network or a higher layer
            - pkg: github.com/dylanvgils/agentic-cli/internal/runtime/dind
              desc: image never imports network or a higher layer
            - pkg: github.com/dylanvgils/agentic-cli/internal/runtime/microsandbox
              desc: image never imports network or a higher layer
            - pkg: github.com/dylanvgils/agentic-cli/internal/usecase
              desc: image never imports network or a higher layer
            - pkg: github.com/dylanvgils/agentic-cli/internal/cli
              desc: image never imports network or a higher layer
        network:
          files:
            - "**/internal/network/**"
          deny:
            - pkg: github.com/dylanvgils/agentic-cli/internal/image
              desc: network never imports image or a higher layer
            - pkg: github.com/dylanvgils/agentic-cli/internal/runtime/docker
              desc: network never imports image or a higher layer
            - pkg: github.com/dylanvgils/agentic-cli/internal/runtime/dind
              desc: network never imports image or a higher layer
            - pkg: github.com/dylanvgils/agentic-cli/internal/runtime/microsandbox
              desc: network never imports image or a higher layer
            - pkg: github.com/dylanvgils/agentic-cli/internal/usecase
              desc: network never imports image or a higher layer
            - pkg: github.com/dylanvgils/agentic-cli/internal/cli
              desc: network never imports image or a higher layer
        runtime:
          files:
            - "**/internal/runtime/**"
          deny:
            - pkg: github.com/dylanvgils/agentic-cli/internal/usecase
              desc: runtime never imports usecase or cli
            - pkg: github.com/dylanvgils/agentic-cli/internal/cli
              desc: runtime never imports usecase or cli
        usecase:
          files:
            - "**/internal/usecase/**"
          deny:
            - pkg: github.com/dylanvgils/agentic-cli/internal/cli
              desc: usecase never imports cli
        dind:
          files:
            - "**/internal/runtime/dind/**"
          deny:
            - pkg: github.com/dylanvgils/agentic-cli/internal/runtime/docker
              desc: the sidecar lifecycle lives in runtime/docker/dind.go
        proxy:
          files:
            - "**/internal/network/proxy/**"
          deny:
            - pkg: github.com/dylanvgils/agentic-cli/internal/network/credentials
              desc: credentials are resolved on the host side
        proxy-binary:
          files:
            - "**/cmd/proxy/**"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/dylanvgils/agentic-cli/internal/network/proxy
        certs:
          files:
            - "**/internal/network/certs/**"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
