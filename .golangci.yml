version: "2"

run:
  build-tags:
    - integration

linters:
  settings:
    staticcheck:
      checks:
        # Includes the style checks off by default, e.g. ST1000 (package comments)
        - all
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
