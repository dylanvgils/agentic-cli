version: "2"

run:
  build-tags:
    - integration

linters:
  enable:
    - forbidigo
  settings:
    forbidigo:
      # all IO goes through internal/infra/iostreams and logging; only iostreams.System names the streams
      forbid:
        - pattern: ^os\.Std(in|out|err)$
        - pattern: ^fmt\.Print(f|ln)?$
        - pattern: ^print(ln)?$
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
    staticcheck:
      checks:
        - all
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println

  exclusions:
    rules:
      - path: (_test\.go$|^test/integration/)
        linters:
          - forbidigo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
