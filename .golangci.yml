version: "2"

run:
  build-tags:
    - integration

linters:
  enable:
    - depguard
    - forbidigo
  settings:
    depguard:
      rules:
        # The proxy is a standalone service: only the stdlib and these packages; logs go through log/slog
        proxy:
          list-mode: strict
          files:
            - "**/internal/network/proxy/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/dylanvgils/agentic-cli/internal/config
            - github.com/dylanvgils/agentic-cli/internal/infra/iostreams
            - github.com/dylanvgils/agentic-cli/internal/network/certs
        # Its binary only wires the streams and starts it
        proxy-main:
          list-mode: strict
          files:
            - "**/cmd/proxy/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/dylanvgils/agentic-cli/internal/infra/iostreams
            - github.com/dylanvgils/agentic-cli/internal/network/proxy
    forbidigo:
      # all IO goes through internal/infra/iostreams and logging; only iostreams.System names the streams
      forbid:
        - pattern: ^os\.Std(in|out|err)$
        - pattern: ^fmt\.Print(f|ln)?$
        - pattern: ^print(ln)?$
        - pattern: ^log\.(Print|Fatal|Panic)(f|ln)?$
    staticcheck:
      checks:
        - all
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println

  exclusions:
    rules:
      - path: (_test\.go$|^test/integration/)
        linters:
          - forbidigo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
